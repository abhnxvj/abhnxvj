  </defs>
  <rect width="1200" height="338" rx="12" fill="#f7f7f6"/>
  <rect width="1200" height="338" rx="12" fill="url(#grid)"/>
  <text x="50" y="55" fill="#626267" font-family="Courier New, monospace" font-size="14" letter-spacing="3">AT A GLANCE</text>
  <rect x="50" y="82" width="530" height="135" rx="10" fill="#fbfbfa" stroke="#cbcbcc"/>
  <rect x="620" y="82" width="530" height="135" rx="10" fill="#fbfbfa" stroke="#cbcbcc"/>
  <text x="75" y="150" fill="#1d1d20" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="400">17</text>
  <text x="75" y="180" fill="#343439" font-family="Arial, Helvetica, sans-serif" font-size="20">repositories <tspan fill="#727278">(public + private)</tspan></text>
