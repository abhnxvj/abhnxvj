<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Project map</title>
  <desc id="desc">Five projects across data foundations, investigation, prediction, and decision tools: SQL Data Warehouse, Causa, IPO Listing Gain Predictor, BrickOne, and OneSeat.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#071522"/>
      <stop offset="1" stop-color="#16354a"/>
    </linearGradient>
    <linearGradient id="line" x2="1">
      <stop stop-color="#59dfc9"/>
      <stop offset="1" stop-color="#91a6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <text x="42" y="49" fill="#74dfd0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">SELECTED WORK / PROJECT MAP</text>
  <text x="42" y="80" fill="#f1f8ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Systems that turn information into decisions</text>
  <path d="M88 194 H1110" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 8" opacity=".75"/>
  <g fill="#72e3d3" filter="url(#glow)">
    <circle cx="126" cy="194" r="8"/>
    <circle cx="355" cy="194" r="8"/>
    <circle cx="584" cy="194" r="8"/>
    <circle cx="813" cy="194" r="8"/>
    <circle cx="1042" cy="194" r="8"/>
  </g>
  <g fill="#142c3e" stroke="#426478">
    <rect x="35" y="115" width="184" height="64" rx="12"/>
    <rect x="264" y="209" width="184" height="64" rx="12"/>
    <rect x="493" y="115" width="184" height="64" rx="12"/>
    <rect x="722" y="209" width="184" height="64" rx="12"/>
    <rect x="951" y="115" width="184" height="64" rx="12"/>
  </g>
  <g fill="#f2f8fc" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="127" y="144">SQL Data</text><text x="127" y="164">Warehouse</text>
    <text x="356" y="247">Causa</text>
    <text x="585" y="144">IPO Listing Gain</text><text x="585" y="164">Predictor</text>
    <text x="814" y="247">BrickOne</text>
    <text x="1043" y="153">OneSeat</text>
  </g>
  <g fill="#a3c0d0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="127" y="310">DATA FOUNDATION</text>
    <text x="356" y="310">KPI INVESTIGATION</text>
    <text x="585" y="310">PREDICTION</text>
    <text x="814" y="310">FINANCE TOOLS</text>
    <text x="1043" y="310">CHOICE SUPPORT</text>
  </g>
</svg>
